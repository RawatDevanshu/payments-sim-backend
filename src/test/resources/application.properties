# Use H2 in-memory DB for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate configuration for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable spring-dotenv for tests since we are using static config
spring.config.import=


# JWT Secret config for tests
jwt.secret=testsecretkeytestsecretkeytestsecretkeytestsecretkeytestsecretkey

